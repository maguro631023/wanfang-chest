<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>胸訴 — 胸腔科門診問診</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F2233">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="胸腔科門診問診：病人以點選、圖示與語音整理症狀與病史。研發測試中，非醫療器材。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="胸訴">
<style>
/* ============================================================
   設計代幣 —— 沿用 wanfang-* 系列（語圖）的 navy / teal / amber，
   另加一個「紅旗」紅色，只用在需要立即處理的警示。
   ============================================================ */
:root{
  --ink:#0F2233; --ink-soft:#4A5C6A;
  --paper:#FFFFFF; --surface:#EBF0F2; --surface-2:#DCE5E8;
  --teal:#0B6E6B; --teal-dark:#095452; --teal-tint:#E4F2F1;
  --amber:#B45309; --amber-tint:#FFF4E5;
  --red:#B42318; --red-tint:#FDECEA;
  --line:#B9C7CE; --focus:#1D4ED8;
  --step:1; --tile-min:150px; --radius:12px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  margin:0; background:var(--surface); color:var(--ink);
  font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:calc(17px * var(--step)); line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; font-size:inherit; cursor:pointer; color:inherit; }
:focus-visible{ outline:4px solid var(--focus); outline-offset:3px; }
[hidden]{ display:none !important; }

.app{ max-width:1080px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
  background:var(--paper); box-shadow:0 0 0 1px var(--line); }

/* ---------- 頂列 ---------- */
.topbar{ display:flex; align-items:center; gap:10px; padding:10px 14px;
  background:var(--ink); color:#fff; position:sticky; top:0; z-index:20; }
.brand{ font-size:calc(21px * var(--step)); font-weight:800; letter-spacing:.08em; margin-right:auto; }
.brand small{ display:block; font-size:calc(11px * var(--step)); font-weight:400; letter-spacing:.02em; opacity:.72; }
.modeswitch{ display:flex; background:rgba(255,255,255,.14); border-radius:999px; padding:3px; }
.modeswitch button{ border:0; background:transparent; color:#fff; padding:9px 16px; border-radius:999px; font-weight:700; min-height:44px; }
.modeswitch button[aria-pressed="true"]{ background:var(--teal); }
.iconbtn{ border:0; background:rgba(255,255,255,.14); color:#fff; width:46px; height:46px; border-radius:10px;
  font-size:20px; display:grid; place-items:center; }

/* ---------- 進度（五個階段是真正的先後順序，所以用編號） ---------- */
.stepper{ display:flex; gap:4px; padding:10px 14px 0; background:var(--paper); }
.stepper .st{ flex:1; text-align:center; font-size:calc(12.5px * var(--step)); font-weight:700; color:var(--ink-soft); }
.stepper .st i{ display:block; height:6px; border-radius:3px; background:var(--surface-2); margin-bottom:5px; }
.stepper .st.done i{ background:var(--teal); }
.stepper .st.now{ color:var(--ink); }
.stepper .st.now i{ background:linear-gradient(90deg,var(--teal) var(--p,50%),var(--surface-2) var(--p,50%)); }

main{ flex:1; padding:16px 14px 120px; }

/* ---------- 題目 ---------- */
.qhead{ display:flex; align-items:flex-start; gap:12px; margin:4px 0 6px; }
.qtext{ flex:1; margin:0; font-size:calc(25px * var(--step)); font-weight:800; line-height:1.4; }
.listen{ flex:0 0 auto; border:2px solid var(--teal); background:var(--teal-tint); color:var(--teal-dark);
  border-radius:12px; min-width:64px; min-height:60px; font-size:calc(14px * var(--step)); font-weight:800;
  display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15; padding:4px 8px; }
.listen b{ font-size:24px; }
.qhint{ color:var(--ink-soft); margin:0 0 16px; font-size:calc(16px * var(--step)); }
.qhint.multi::before{ content:"☑ "; color:var(--teal); font-weight:800; }

/* ---------- 選項格 ---------- */
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--tile-min),1fr)); gap:12px; }
.grid.wide{ --tile-min:260px; }
.tile{ position:relative; border:3px solid var(--line); background:var(--paper); border-radius:var(--radius);
  padding:0; overflow:hidden; min-height:150px; display:flex; flex-direction:column; text-align:center;
  transition:transform .08s ease, border-color .12s ease; }
.tile:active{ transform:scale(.97); }
.tile .art{ flex:1; display:grid; place-items:center; background:var(--surface); min-height:88px; padding:8px; }
.tile .emo{ font-size:calc(46px * var(--step)); line-height:1; }
.tile .gly{ font-size:calc(26px * var(--step)); font-weight:800; color:var(--teal-dark); letter-spacing:.02em; }
.tile .sw{ width:58px; height:58px; border-radius:50%; border:3px solid rgba(15,34,51,.25); }
.tile .label{ padding:10px 8px; font-size:calc(18.5px * var(--step)); font-weight:700; line-height:1.35;
  border-top:2px solid var(--line); }
.tile.row{ flex-direction:row; min-height:84px; text-align:left; }
.tile.row .art{ flex:0 0 84px; min-height:auto; }
.tile.row .label{ border-top:0; border-left:2px solid var(--line); display:flex; align-items:center; flex:1; padding:12px 14px; }
.tile.on{ border-color:var(--teal); }
.tile.on .art{ background:var(--teal-tint); }
.tile.on .label{ background:var(--teal); color:#fff; border-color:var(--teal); }
.tile.on::after{ content:"✓"; position:absolute; top:6px; right:8px; width:34px; height:34px; border-radius:50%;
  background:var(--teal); color:#fff; font-weight:800; font-size:20px; display:grid; place-items:center; }
.tile.red.on{ border-color:var(--red); }
.tile.red.on .label{ background:var(--red); border-color:var(--red); }
.tile.red.on::after{ background:var(--red); }
body[data-text="off"] .tile .label{ display:none; }

/* ---------- 程度量表 ---------- */
.lvls{ display:grid; gap:10px; }
.lv{ display:flex; align-items:center; gap:14px; border:3px solid var(--line); background:var(--paper);
  border-radius:var(--radius); padding:10px 14px; min-height:70px; font-weight:700; text-align:left;
  font-size:calc(19px * var(--step)); }
.lv .bar{ flex:0 0 auto; display:flex; gap:4px; }
.lv .bar i{ width:12px; height:28px; border-radius:3px; background:var(--surface-2); }
.lv .bar i.f{ background:var(--amber); }
.lv.on{ border-color:var(--amber); background:var(--amber-tint); }

.nrs{ display:grid; grid-template-columns:repeat(11,1fr); gap:6px; }
.nrs button{ border:3px solid var(--line); background:var(--paper); border-radius:10px; min-height:84px;
  padding:6px 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  font-size:calc(22px * var(--step)); font-weight:800; }
.nrs button .f{ font-size:24px; height:28px; }
.nrs button.on{ border-color:var(--amber); background:var(--amber); color:#fff; }
.nrsends{ display:flex; justify-content:space-between; margin-top:8px; color:var(--ink-soft); font-weight:700; }
@media (max-width:620px){
  .nrs{ grid-template-columns:repeat(6,1fr); }
}

/* ---------- 年齡鍵盤 ---------- */
.numpad{ max-width:420px; margin:0 auto; }
.numshow{ text-align:center; font-size:calc(64px * var(--step)); font-weight:800; min-height:96px;
  border:3px solid var(--line); border-radius:var(--radius); background:var(--surface); margin-bottom:12px; }
.numshow small{ font-size:calc(26px * var(--step)); color:var(--ink-soft); margin-left:6px; }
.keys{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.keys button{ min-height:72px; border:2px solid var(--line); border-radius:12px; background:var(--paper);
  font-size:calc(30px * var(--step)); font-weight:800; }
.keys button.fn{ background:var(--surface); font-size:calc(20px * var(--step)); }

/* ---------- 身體圖 ---------- */
.bodywrap{ display:grid; grid-template-columns:minmax(0,360px) 1fr; gap:16px; align-items:start; }
@media (max-width:700px){ .bodywrap{ grid-template-columns:1fr; } }
.body svg{ width:100%; height:auto; display:block; }
.body .skin{ fill:var(--surface); stroke:var(--ink-soft); stroke-width:2.5; }
.body .rg{ fill:#fff; stroke:var(--line); stroke-width:2; cursor:pointer; }
.body .rg:hover{ stroke:var(--teal); }
.body .rg.on{ fill:var(--red); stroke:var(--red); fill-opacity:.85; }
.body .rl{ font-size:15px; font-weight:800; fill:var(--ink); pointer-events:none; text-anchor:middle; }
.body .rl.on{ fill:#fff; }
.body .side{ font-size:14px; font-weight:800; fill:var(--ink-soft); text-anchor:middle; }
.bodynote{ font-size:calc(14px * var(--step)); color:var(--ink-soft); margin:6px 0 0; text-align:center; }

/* ---------- 文字補充 ---------- */
.note textarea{ width:100%; min-height:160px; border:3px solid var(--line); border-radius:var(--radius);
  padding:14px; font:inherit; font-size:calc(20px * var(--step)); }
.mic{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; margin-top:12px;
  min-height:76px; border:3px solid var(--teal); background:var(--teal-tint); color:var(--teal-dark);
  border-radius:var(--radius); font-weight:800; font-size:calc(21px * var(--step)); }
.mic.rec{ background:var(--red); border-color:var(--red); color:#fff; }
.mic.rec b{ animation:pulse 1s infinite; }
@keyframes pulse{ 50%{ opacity:.35; } }

/* ---------- 底部導覽（大拇指可及） ---------- */
.navbar{ position:fixed; left:0; right:0; bottom:0; z-index:15;
  background:rgba(255,255,255,.97); border-top:2px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
.navbar .in{ max-width:1052px; margin:0 auto; display:flex; gap:10px; }
.bigbtn{ border:3px solid transparent; border-radius:var(--radius); padding:14px 18px; min-height:66px;
  font-weight:800; font-size:calc(20px * var(--step)); }
.bigbtn.ok{ background:var(--teal); color:#fff; flex:2; }
.bigbtn.ok:hover{ background:var(--teal-dark); }
.bigbtn.ghost{ background:var(--surface); border-color:var(--line); flex:1; }
.bigbtn.warn{ background:var(--paper); border-color:var(--amber); color:var(--amber); }
.bigbtn.block{ display:block; width:100%; }

/* ---------- 首頁 ---------- */
.hero{ padding:10px 2px 6px; }
.hero h1{ font-size:calc(34px * var(--step)); line-height:1.3; margin:8px 0 12px; font-weight:800; }
.hero p{ font-size:calc(19px * var(--step)); color:var(--ink-soft); margin:0 0 20px; max-width:34em; }
.how{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 0 24px; }
.how div{ background:var(--surface); border-radius:var(--radius); padding:14px 10px; text-align:center; font-weight:700; }
.how div b{ display:block; font-size:40px; line-height:1.2; margin-bottom:4px; }
.startbtn{ width:100%; min-height:88px; font-size:calc(26px * var(--step)); }
.homeactions{ display:grid; gap:12px; }

/* ---------- 總覽（病人看） ---------- */
.revsec h2{ font-size:calc(19px * var(--step)); margin:22px 0 8px; padding-bottom:6px; border-bottom:2px solid var(--surface-2); }
.revrow{ display:flex; gap:12px; align-items:center; width:100%; text-align:left; border:2px solid var(--line);
  background:var(--paper); border-radius:10px; padding:12px 14px; margin-bottom:8px; }
.revrow .k{ flex:0 0 7.5em; color:var(--ink-soft); font-weight:700; font-size:calc(15px * var(--step)); }
.revrow .v{ flex:1; font-weight:700; }
.revrow .v.empty{ color:var(--amber); }
.revrow .ed{ color:var(--teal-dark); font-weight:800; font-size:calc(14px * var(--step)); }
.saybox{ border:3px solid var(--teal); background:var(--teal-tint); border-radius:var(--radius); padding:16px 18px;
  font-size:calc(21px * var(--step)); font-weight:700; line-height:1.75; margin-bottom:14px; }
.saybox p{ margin:0 0 6px; }

/* ---------- 醫師摘要 ---------- */
.doc h2{ font-size:calc(18px * var(--step)); margin:22px 0 8px; display:flex; align-items:baseline; gap:10px; }
.doc h2 small{ font-weight:500; color:var(--ink-soft); font-size:calc(13px * var(--step)); }
.pt{ display:flex; flex-wrap:wrap; gap:8px 18px; font-size:calc(20px * var(--step)); font-weight:800;
  padding:12px 14px; background:var(--surface); border-radius:10px; }
.pt span{ font-weight:500; color:var(--ink-soft); font-size:calc(15px * var(--step)); }
.flags{ display:grid; gap:8px; }
.flag{ border-left:6px solid; border-radius:0 10px 10px 0; padding:10px 14px; font-weight:700; }
.flag.red{ border-color:var(--red); background:var(--red-tint); color:#7A1A12; }
.flag.amber{ border-color:var(--amber); background:var(--amber-tint); color:#6B3406; }
.flag.info{ border-color:var(--teal); background:var(--teal-tint); color:var(--teal-dark); }
.flag small{ display:block; font-weight:500; margin-top:2px; }
.cc{ display:flex; flex-wrap:wrap; gap:8px; }
.cc span{ background:var(--ink); color:#fff; border-radius:999px; padding:6px 14px; font-weight:800; }
.grp{ border:2px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; }
.grp > header{ background:var(--surface); padding:10px 14px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.grp > header b{ font-size:calc(18px * var(--step)); margin-right:auto; }
.dim{ font-size:calc(12.5px * var(--step)); font-weight:800; border-radius:6px; padding:2px 7px; }
.dim.y{ background:var(--teal); color:#fff; }
.dim.n{ background:var(--paper); color:var(--amber); border:1.5px dashed var(--amber); }
.kv{ display:grid; grid-template-columns:9.5em 1fr; gap:0; margin:0; }
.kv dt, .kv dd{ padding:8px 14px; border-top:1px solid var(--surface-2); margin:0; }
.kv dt{ color:var(--ink-soft); font-weight:700; font-size:calc(15px * var(--step)); }
.kv dd{ font-weight:600; }
.kv dd.miss{ color:var(--amber); font-weight:700; }
.kv dd .r{ color:var(--red); font-weight:800; }
.asks{ padding:8px 14px 12px; border-top:1px solid var(--surface-2); background:#FAFCFC; }
.asks p{ margin:4px 0 6px; font-size:calc(13.5px * var(--step)); color:var(--ink-soft); font-weight:700; }
.asks label{ display:flex; gap:10px; align-items:flex-start; padding:5px 0; font-size:calc(15.5px * var(--step)); cursor:pointer; }
.asks input{ width:22px; height:22px; margin-top:2px; accent-color:var(--teal); flex:0 0 auto; }
.docactions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
.docactions .bigbtn{ flex:1 1 180px; }
.disclaim{ font-size:calc(13px * var(--step)); color:var(--ink-soft); margin-top:14px; }

/* ---------- 紅旗警示 ---------- */
.alert{ position:fixed; inset:0; z-index:60; background:rgba(15,34,51,.62); display:grid; place-items:center; padding:18px; }
.alert .card{ background:var(--paper); border-radius:16px; max-width:480px; width:100%; overflow:hidden;
  box-shadow:0 24px 60px rgba(15,34,51,.4); }
.alert .card header{ background:var(--red); color:#fff; padding:18px 20px; font-size:calc(26px * var(--step)); font-weight:800; }
.alert .card div{ padding:18px 20px 20px; font-size:calc(21px * var(--step)); font-weight:700; }
.alert .card .bigbtn{ width:100%; margin-top:16px; background:var(--red); color:#fff; }

.said{ position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:var(--ink); color:#fff;
  padding:12px 24px; border-radius:14px; font-size:calc(21px * var(--step)); font-weight:800;
  box-shadow:0 10px 30px rgba(15,34,51,.34); z-index:40; max-width:90vw; text-align:center; }

/* ---------- 設定 ---------- */
dialog{ border:0; border-radius:14px; padding:0; width:min(460px,92vw); box-shadow:0 24px 60px rgba(15,34,51,.3); }
dialog::backdrop{ background:rgba(15,34,51,.5); }
.dlg-head{ background:var(--ink); color:#fff; padding:16px 20px; font-weight:800; font-size:calc(19px * var(--step)); }
.dlg-body{ padding:18px 20px 22px; display:grid; gap:18px; max-height:78vh; overflow:auto; }
.field > span{ display:block; font-weight:700; margin-bottom:8px; }
.seg{ display:flex; gap:8px; flex-wrap:wrap; }
.seg button{ flex:1; border:2px solid var(--line); background:var(--paper); padding:12px 8px; border-radius:9px;
  font-weight:700; min-height:50px; }
.seg button[aria-pressed="true"]{ background:var(--teal); color:#fff; border-color:var(--teal); }
.fnote{ margin:6px 0 0; font-size:calc(13px * var(--step)); color:var(--ink-soft); }

footer{ padding:16px 14px 110px; text-align:center; color:var(--ink-soft); font-size:calc(13px * var(--step));
  line-height:1.6; border-top:1px solid var(--line); }
.notice{ font-weight:700; color:var(--amber); }

@media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }

@media print{
  .topbar,.stepper,.navbar,footer,.docactions,.said,.asks input{ display:none !important; }
  main{ padding:0; } body{ background:#fff; font-size:12pt; } .app{ box-shadow:none; }
  .grp{ break-inside:avoid; }
}

/* ---------- v2：多語言、圖示後備、使用前告知 ---------- */
.tile .art svg{ width:calc(66px * var(--step)); height:calc(66px * var(--step)); }
.tile .art img{ width:100%; height:100%; max-height:120px; object-fit:contain; display:block; }
.tile .fb{ width:calc(60px * var(--step)); height:calc(60px * var(--step)); border-radius:50%;
  background:var(--paper); border:3px solid var(--teal); color:var(--teal-dark);
  display:grid; place-items:center; font-weight:800; font-size:calc(20px * var(--step)); overflow:hidden; }
.label small.zh, .lv small.zh{ display:block; font-size:calc(13.5px * var(--step)); font-weight:500; opacity:.78; margin-top:2px; }
.zhq{ margin:-2px 0 6px; color:var(--ink-soft); font-size:calc(15px * var(--step)); }
.langrow{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; }
.langrow button{ border:2px solid var(--line); background:var(--paper); border-radius:999px;
  padding:9px 16px; min-height:48px; font-weight:700; }
.langrow button[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:#fff; }
.langlabel{ font-size:calc(14px * var(--step)); font-weight:700; color:var(--ink-soft); margin:4px 0 8px; }
.warnnote{ background:var(--amber-tint); color:#6B3406; border-radius:10px; padding:10px 14px; font-weight:700; margin:0 0 16px; }
.noticelist{ list-style:none; margin:0 0 22px; padding:0; display:grid; gap:12px; }
.noticelist li{ display:flex; gap:14px; align-items:flex-start; background:var(--surface); border-radius:var(--radius);
  padding:14px 16px; font-size:calc(19px * var(--step)); font-weight:600; line-height:1.55; }
.noticelist li b{ flex:0 0 auto; font-size:28px; line-height:1.1; }
.noticelist li.urgent{ background:var(--red-tint); color:#7A1A12; }
.pairs{ display:grid; gap:10px; }
.pairs div{ border-bottom:1px solid rgba(9,84,82,.2); padding-bottom:8px; }
.pairs div:last-child{ border-bottom:0; }
.pairs .pq{ font-size:calc(15px * var(--step)); font-weight:600; color:var(--ink-soft); }
.pairs .pa{ font-size:calc(20px * var(--step)); font-weight:800; }
.about{ background:var(--surface); border-radius:10px; padding:12px 14px; font-size:calc(13.5px * var(--step)); line-height:1.65; }
.about b{ display:block; font-size:calc(15px * var(--step)); margin-bottom:4px; }
.seg.wrap button{ flex:1 1 30%; }
/* ---------- v2.5：序號送出與取件 ---------- */
.field select{ width:100%; min-height:52px; border:2px solid var(--line); border-radius:9px; padding:10px 12px;
  font:inherit; font-size:calc(17px * var(--step)); font-weight:700; background:var(--paper); color:var(--ink); }
.locked{ margin-top:8px; background:var(--surface); border-radius:9px; padding:10px 12px; font-size:calc(13px * var(--step)); }
.locked div{ display:flex; gap:8px; align-items:baseline; padding:3px 0; }
.locked b{ flex:0 0 3.2em; color:var(--ink-soft); font-weight:700; }
.locked span{ flex:1; word-break:break-all; font-family:ui-monospace,Menlo,Consolas,monospace; }
.locked::after{ content:"🔒 由管理者設定，平板端不需修改"; display:block; margin-top:6px; color:var(--ink-soft); }
.locked.open::after{ content:"🔧 維護模式：可修改，關閉設定後恢復鎖定"; color:var(--amber); }
#apiTitle{ cursor:default; }
.field input[type="text"], .field input[type="password"]{ width:100%; min-height:52px; border:2px solid var(--line);
  border-radius:9px; padding:10px 12px; font:inherit; font-size:calc(16px * var(--step)); background:var(--paper); color:var(--ink); }
.serialshow{ text-align:center; font-size:calc(58px * var(--step)); font-weight:800; letter-spacing:.06em; min-height:92px;
  border:3px solid var(--line); border-radius:var(--radius); background:var(--surface); margin-bottom:12px; }

/* ============================================================
   3. 語音輸出
   ------------------------------------------------------------
   · 語音合成必須在使用者手勢的同步流程裡呼叫。
   · iOS 第一次觸控先送一個靜音 utterance 解鎖。
   · 外語裝置沒有該語言的語音時，改用華語唸華語內容
     （絕不把外語文字丟給中文語音唸，會變成無意義的音）。
   ============================================================ */
const hasTTS = "speechSynthesis" in window;
const audioAvail = Object.create(null);
let unlocked = false, curAudio = null;

/* ------------------------------------------------------------
   挑選語音
   同一種語言，每台裝置裝的語音不同，瀏覽器列出的順序也不同。
   舊版直接取「第一個」，所以 iPhone 可能拿到美佳（加強版，自然女聲），
   iPad 卻拿到 Eddy 這類 Eloquence 引擎的趣味語音（機械感男聲）。
   現在改為：① 使用者在設定頁為這台裝置指定的語音；② 否則依評分自動挑。
   ------------------------------------------------------------ */
const NOVELTY = /eloquence|\b(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy)\b/i;
const GOOD = {
  "zh-TW":/meijia|美佳|hsiaochen|曉臻|hsiaoyu|曉雨|yunjhe|雲哲|google\s*國語|國語（臺灣）|國語\(臺灣\)/i,
  "en-US":/samantha|ava|allison|google us english|aria|jenny|guy/i,
  "id-ID":/damayanti|gadis|ardi|google bahasa indonesia/i,
  "vi-VN":/linh|hoaimy|namminh|google tiếng việt/i,
  "ja-JP":/kyoko|o-ren|nanami|keita|google 日本語/i
};
const normLang = v => (v.lang || "").replace("_","-");
function voiceScore(v, code){
  const lang = normLang(v), base = code.split("-")[0];
  const id = (v.name || "") + " " + (v.voiceURI || "");
  if (lang.split("-")[0] !== base) return -1;
  if (base === "zh" && /^(zh-HK|yue)/i.test(lang)) return -1;        // 粵語，不能拿來唸國語
  let s = 10;
  if (lang.toLowerCase() === code.toLowerCase()) s += 50;
  else if (code === "zh-TW" && /zh-CN|cmn/i.test(lang)) s += 20;     // 國語其他腔調，勉強可用
  if (NOVELTY.test(id)) s -= 60;                                       // 趣味／機械感語音
  if (/enhanced|premium|加強|高品質|natural|neural|siri/i.test(id)) s += 30;
  if (GOOD[code] && GOOD[code].test(id)) s += 20;
  if (/compact/i.test(id)) s -= 5;
  if (v.localService) s += 3;                                          // 本機語音，離線也能用
  return s;
}
function voicesFor(code){
  if (!hasTTS) return [];
  return (speechSynthesis.getVoices() || [])
    .map(v => ({ v, s:voiceScore(v, code) })).filter(x => x.s >= 0)
    .sort((a, b) => b.s - a.s).map(x => x.v);
}
function pickVoice(code){
  const list = voicesFor(code);
  if (!list.length) return null;
  const want = (settings.voices || {})[code];
  return (want && list.find(v => v.voiceURI === want)) || list[0];
}
function voiceOK(lg){ const l = langOf(lg); return !!(hasTTS && l.tts && pickVoice(l.code)); }
function unlock(){
  if (unlocked) return; unlocked = true;
  if (hasTTS){ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; try { speechSynthesis.speak(u); } catch(e){} }
}
["pointerdown","touchstart","click"].forEach(ev => document.addEventListener(ev, unlock, { once:true, capture:true }));

function probeAudio(lg){
  if (typeof fetch !== "function") return;
  const ids = ["alert","review","notice","hero"];
  Q.forEach(q => { ids.push(q.id); (q.opts || []).forEach(x => ids.push(q.id + "__" + x.v)); });
  ids.forEach(id => {
    const k = lg + ":" + id;
    if (audioAvail[k] !== undefined) return;
    audioAvail[k] = false;
    fetch(`assets/audio/${lg}/${id}.mp3`, { method:"HEAD" }).then(r => { audioAvail[k] = r.ok; }).catch(() => {});
  });
}
function stopAll(){
  if (curAudio){ try { curAudio.pause(); } catch(e){} curAudio = null; }
  if (hasTTS) speechSynthesis.cancel();
}
function tts(text, code, queue){
  if (!hasTTS || !text) return;
  try {
    if (!queue) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(code); if (v) u.voice = v;
    u.lang = code; u.rate = Number(settings.rate) || 0.88;
    speechSynthesis.speak(u);
  } catch(e){}
}
/* zh：華語內容；tr：目前語言內容；key：錄音檔代號 */
function say(zh, tr, key, queue){
  unlock();
  const l = L();
  if (!queue && curAudio){ try { curAudio.pause(); } catch(e){} curAudio = null; }
  if (l.audio && key && audioAvail[l.id + ":" + key]){
    if (hasTTS) speechSynthesis.cancel();
    curAudio = new Audio(`assets/audio/${l.id}/${key}.mp3`);
    curAudio.play().catch(() => tts(zh, "zh-TW", queue));
    return;
  }
  if (l.foreign && voiceOK(l.id)) tts(tr || zh, l.code, queue);
  else tts(zh, "zh-TW", queue);
}
let flashTimer = null;
function flash(text){
  const el = document.getElementById("said");
  el.textContent = "🔊 " + text; el.hidden = false;
  el.classList.toggle("long", String(text).length > 14);
  clearTimeout(flashTimer); flashTimer = setTimeout(() => { el.hidden = true; }, 2200);
}
const qSayZh = q => q.q + (q.hint ? "。" + q.hint : "");
const qSayTr = q => tq(q) + (th(q) ? ". " + th(q) : "");

/* ============================================================
   4. 圖示：舊手機的後備順序
   ------------------------------------------------------------
   ① 自訂圖檔：assets/img/{題目id}__{選項值}.webp（或 .png、.svg），
      並把檔名列在 assets/img/index.json，例如 ["cc__cough.webp"]
      ——用清單而不逐一試抓，避免每個格子都產生 404。
   ② 內建向量圖示：主要症狀那一頁的 10 個，任何手機都畫得出來。
   ③ emoji：先在畫布上實際畫一次，偵測這台手機能不能顯示成彩色、
      是否為單一字形（舊 Android 會畫成方塊或拆成兩個字）。
   ④ 文字圖：以上都不行時，用選項的前幾個字做成圓形圖示。
   ============================================================ */
const IMG_FILES = Object.create(null);
if (typeof fetch === "function"){
  fetch("assets/img/index.json", { cache:"no-cache" }).then(r => r.ok ? r.json() : [])
    .then(list => { (list || []).forEach(f => { IMG_FILES[String(f).replace(/\.(webp|png|svg|jpg)$/i, "")] = f; });
                    if (screen === "q") renderQ(); })
    .catch(() => {});
}
const emojiOK = (() => {
  const cache = Object.create(null);
  let ctx = null, base = 0;
  try {
    const c = document.createElement("canvas"); c.width = c.height = 48;
    ctx = c.getContext("2d", { willReadFrequently:true });
    ctx.font = "36px sans-serif"; ctx.textBaseline = "top";
    base = ctx.measureText("😀").width;
  } catch(e){ ctx = null; }
  return e => {
    if (e in cache) return cache[e];
    if (!ctx) return (cache[e] = true);
    ctx.clearRect(0, 0, 48, 48); ctx.fillText(e, 0, 0);
    const w = ctx.measureText(e).width;
    const d = ctx.getImageData(0, 0, 48, 48).data;
    let color = false;
    for (let i = 0; i < d.length; i += 4){
      if (d[i+3] > 40 && (Math.abs(d[i] - d[i+1]) > 24 || Math.abs(d[i+1] - d[i+2]) > 24)){ color = true; break; }
    }
    return (cache[e] = color && (!base || w < base * 1.6));
  };
})();

function initials(text){
  const t = String(text).replace(/（.*?）|\(.*?\)/g, "").trim();
  if (/^[\u3000-\u9fff]/.test(t)) return t.slice(0, 2);
  return (t.split(/[\s,，、]+/)[0] || t).slice(0, 5);
}
function artHTML(q, x){

/* ============================================================
   5. 流程
   ============================================================ */
function flow(){ return Q.filter(q => !q.when || q.when(ans)); }
function isAnswered(q){
  const v = ans[q.id];
  if (v == null) return false;
  if (Array.isArray(v)) return v.length > 0;
  return String(v).trim() !== "";
}
function prune(){
  const live = new Set(flow().map(q => q.id));
  Object.keys(ans).forEach(k => { if (k !== "_lang" && !live.has(k)) delete ans[k]; });
}
function go(id, silent){
  curId = id; screen = "q";
  if (!silent && settings.autoread === "on") sayQ(qById(id));
  render(); window.scrollTo(0,0);
}
function nextQ(){
  prune(); save();
  if (returnToReview){ returnToReview = false; toReview(); return; }
  const f = flow(); const i = f.findIndex(q => q.id === curId);
  if (i < f.length - 1) go(f[i+1].id); else toReview();
}
function prevQ(){
  const f = flow(); const i = f.findIndex(q => q.id === curId);
  if (returnToReview){ returnToReview = false; toReview(); return; }
  if (i > 0) go(f[i-1].id); else { screen = "home"; render(); }
}
function toReview(){
  screen = "review"; curId = null;
  if (settings.autoread === "on") say(UI_ZH.reviewSpeak, T("reviewSpeak"), "review");
  render(); window.scrollTo(0,0);
}

/* ============================================================
   6. 句子與摘要
   ============================================================ */
function valList(q){ const v = ans[q.id]; return v == null ? [] : (Array.isArray(v) ? v : [v]); }
function labelsOf(q, key){
  if (!isAnswered(q)) return [];
  if (q.type === "num" || q.type === "nrs" || q.type === "text") return [String(ans[q.id]).trim()];
  return valList(q).map(x => optOf(q, x)).filter(Boolean).map(x => key === "dx" ? (x.dx || x.label) : key === "tr" ? to(q, x) : x.label);
}
/* 病人版華語句子：一般選項套入樣板，有自己句子的選項另外接在後面 */
function sentence(q){
  if (!isAnswered(q)) return "";
  if (q.type === "num" || q.type === "nrs" || q.type === "text") return q.ps.replace("{}", String(ans[q.id]).trim());
  const opts = valList(q).map(x => optOf(q, x)).filter(Boolean);
  const plain = opts.filter(x => !x.ps).map(x => x.label.replace(/（.*?）/g, ""));
  const own   = opts.filter(x => x.ps).map(x => x.ps);
  const out = [];
  if (plain.length) out.push(q.ps.replace("{}", plain.join(q.join || "、")));
  return out.concat(own).join("");
}
const patientStory = () => flow().map(sentence).filter(Boolean);
function answerTr(q){
  if (!isAnswered(q)) return "";
  if (q.type === "num") return ans[q.id] + " " + T("unit");
  if (q.type === "nrs") return fmt(T("pts"), ans[q.id]);
  if (q.type === "text") return String(ans[q.id]).trim();
  return labelsOf(q, "tr").join(settings.lang === "ja" ? "、" : ", ");
}
function answerZh(q){
  if (!isAnswered(q)) return "";
  if (q.type === "num") return ans[q.id] + " 歲";
  if (q.type === "nrs") return ans[q.id] + " 分";
  if (q.type === "text") return String(ans[q.id]).trim();
  return labelsOf(q).join("、");
}

const LANG_EN = { zh:"Mandarin", nan:"Taiwanese", hak:"Hakka", en:"English", id:"Indonesian", vi:"Vietnamese", ja:"Japanese" };
const dxEn = (q, x) => (DX_EN[q.id] && DX_EN[q.id][x.v] != null) ? DX_EN[q.id][x.v] : (x.dx || x.label);
function dxList(q, lang){
  if (!isAnswered(q)) return [];
  if (q.type === "nrs") return [ans[q.id] + "/10"];
  if (q.type === "num" || q.type === "text") return [String(ans[q.id]).trim()];
  return valList(q).map(v => optOf(q, v)).filter(Boolean).map(x => lang === "en" ? dxEn(q, x) : (x.dx || x.label));
}

function flagsFromOptions(){
  const out = [];
  flow().forEach(q => {
    if (!isAnswered(q) || !q.opts) return;
    valList(q).forEach(v => {
      const x = optOf(q, v);
      if (x && x.flag) out.push({ lv:x.flag, text:`${q.dl}：${x.dx || x.label}`, en:`${DL_EN[q.id] || q.id}: ${dxEn(q, x)}`, grp:q.grp });
    });
  });
  return out;
}
function packYears(){
  const a = optOf(qById("sm_amt"), ans.sm_amt), y = optOf(qById("sm_yrs"), ans.sm_yrs);
  if (!a || !y) return null;
  return { lo: Math.round(a.lo * y.lo), hi: Math.round(a.hi * y.hi) };
}
/* 臨床提醒：每一條同時帶華語（text/sub）與英文（en/subEn） */
function insights(){
  const out = [], age = Number(ans.age) || null;
  const add = (lv, text, en, sub, subEn) => out.push({ lv, text, en, sub, subEn });
  const coughW = ["2to3","3to8","gt8"].includes(ans.cough_dur);
  const resp = anyCC(ans, ["cough","sputum","hemo","cp","weight","fever"]);

  /* 結核病七分篩檢（疾管署）：咳嗽兩週 2、有痰 2、胸痛 1、沒有食慾 1、體重減輕 1；≥ 5 分建議就醫檢查 */
  if (resp){
    const zh = [], en = []; let s = 0;
    if (coughW){ s += 2; zh.push("咳嗽≥2週 2"); en.push("cough ≥2 wk 2"); }
    if (cc(ans,"sputum") || has(ans,"cough_type","wet")){ s += 2; zh.push("有痰 2"); en.push("sputum 2"); }
    if (cc(ans,"cp")){ s += 1; zh.push("胸痛 1"); en.push("chest pain 1"); }
    if (has(ans,"sy_multi","anorexia")){ s += 1; zh.push("食慾不振 1"); en.push("anorexia 1"); }
    if (["1-3","3-5","gt5"].includes(ans.sy_wt) || cc(ans,"weight")){ s += 1; zh.push("體重減輕 1"); en.push("weight loss 1"); }
    add(s >= 5 ? "amber" : "info",
      `結核病七分篩檢：${s} / 7 分${s >= 5 ? "（≥ 5 分，建議胸部 X 光與驗痰）" : ""}`,
      `Taiwan CDC 7-point TB screen: ${s}/7${s >= 5 ? " (≥5: consider CXR and sputum AFB)" : ""}`,
      zh.length ? zh.join("＋") : "無符合項目", en.length ? en.join(" + ") : "no items");
  }
  if (has(ans,"contact","tb") || has(ans,"fhx","tb")) add("amber", "結核病接觸史：家人或同事曾罹肺結核", "TB exposure: family member or coworker with TB");

  /* 吸菸與 LDCT 公費篩檢資格（國健署，2025/1/1 起條件；條件若改版請更新此段）
     家族史：一等親肺癌，男 45–74、女 40–74
     重度吸菸：50–74 歲、≥ 20 包-年、仍吸菸或戒菸未滿 15 年
     https://www.hpa.gov.tw/Pages/List.aspx?nodeid=4619 */
  const py = packYears();
  if (py){
    const pyTxt = py.lo === py.hi ? `${py.lo}` : `${py.lo}–${py.hi}`;
    add("info", `吸菸量估計：約 ${pyTxt} 包-年`, `Est. ${pyTxt} pack-years`,
        "由每日量與年數的區間推估，請當面確認", "estimated from answer ranges; please confirm");
  }
  if (has(ans,"smoke","current")) add("info", "目前吸菸：可轉介戒菸服務", "Current smoker: offer cessation referral");
  if (age){
    const famOK = has(ans,"fhx","lungca") && ((ans.sex === "m" && age >= 45 && age <= 74) || (ans.sex === "f" && age >= 40 && age <= 74));
    let smkZh = null, smkEn = null;
    if (py && age >= 50 && age <= 74 && (has(ans,"smoke","current") || (has(ans,"smoke","former") && ans.sm_quit && ans.sm_quit !== "gt15"))){
      if (py.lo >= 20){ smkZh = "重度吸菸（≥ 20 包-年）"; smkEn = "heavy smoking (≥20 pack-years)"; }
      else if (py.hi >= 20){ smkZh = "吸菸量接近 20 包-年門檻，需確認"; smkEn = "pack-years near 20 threshold, confirm"; }
    }
    if (famOK || smkZh){
      add("info",
        `可能符合國健署 LDCT 公費肺癌篩檢：${[famOK ? "一等親肺癌家族史" : null, smkZh].filter(Boolean).join("、")}`,
        `May qualify for HPA-funded LDCT lung cancer screening: ${[famOK ? "1st-degree FHx of lung cancer" : null, smkEn].filter(Boolean).join(", ")}`,
        "需再確認排除條件：12 個月內做過胸部 CT、曾罹肺癌、懷孕等", "check exclusions: chest CT within 12 mo, prior lung cancer, pregnancy");
    }
  }
  if (cc(ans,"cough") && has(ans,"meds","bp")) add("info", "咳嗽＋服用降血壓藥：確認是否為 ACEI", "Cough + antihypertensive: check for ACEI");
  if (has(ans,"cough_dur","gt8")) add("info", "慢性咳嗽（> 8 週）", "Chronic cough (>8 wk)");
  if ((cc(ans,"hemo") || has(ans,"sp_color","blood")) && has(ans,"meds","anticoag"))
    add("amber", "咳血＋使用抗凝血／抗血小板藥物", "Hemoptysis on anticoagulant/antiplatelet");
  if (has(ans,"dy_pos","ortho") || has(ans,"dy_pos","pnd") || has(ans,"dy_assoc","edema"))
    add("info", "端坐呼吸／夜間陣發性呼吸困難／下肢水腫：需鑑別心因性呼吸困難", "Orthopnea/PND/leg edema: consider cardiac cause of dyspnea");
  if (ans.dy_level != null) add(Number(ans.dy_level) >= 2 ? "amber" : "info", `呼吸困難 mMRC ${ans.dy_level}`, `Dyspnea mMRC ${ans.dy_level}`);
  const osa = ["snore","apnea","sleepy"].filter(v => has(ans,"sl_sym",v)).length;
  if (osa >= 2) add("info", "打鼾／呼吸中止／日間嗜睡：可評估 OSA（STOP-BANG）", "Snoring/witnessed apnea/daytime sleepiness: consider OSA work-up (STOP-BANG)");
  if (has(ans,"sl_drive","often")) add("amber", "開車或靜坐時常打瞌睡：注意行車安全", "Frequent drowsiness when driving/sitting: driving safety");
  const pl = langOf(ans._lang || "zh");
  if (pl.foreign) add("info", `病人以${pl.zhName}填寫：選項已轉為華語，但可能需要翻譯協助當面確認`,
                      `Completed in ${LANG_EN[pl.id]}: answers mapped to standard terms; interpreter may be needed`);
  if (pl.foreign && isAnswered(qById("note"))) add("amber", `「病人補充」是以${pl.zhName}輸入，可能需要翻譯`, `Patient's note entered in ${LANG_EN[pl.id]}; may need translation`);
  return out;
}

function nowStr(){

  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

  return seen;

const HX_IDS = ["smoke","sm_amt","sm_yrs","sm_quit","expo","occ","contact","pmh","meds","allergy","fhx"];

/* 病歷摘要純文字：lang = "zh" 華語、"en" 英文 */
function docText(lang){
  const en = lang === "en";
  const J = en ? ", " : "、", S = en ? "; " : "；", C = en ? ": " : "：";
  const Ls = [], pl = langOf(ans._lang || "zh");
  const lbl = q => en ? (DL_EN[q.id] || q.dl) : q.dl;
  const vals = q => dxList(q, lang).join(J);
  if (en){
    Ls.push("[Pulmonary Clinic Pre-visit Summary] " + nowStr());
    const sex = ans.sex === "m" ? "M" : ans.sex === "f" ? "F" : "sex N/A";
    const visit = isAnswered(qById("visit")) ? vals(qById("visit")) : "visit type N/A";
    Ls.push(`Pt: ${ans.age ? ans.age + " y/o" : "age N/A"} ${sex} | ${visit}${pl.id !== "zh" ? " | Language: " + LANG_EN[pl.id] : ""}`);
  } else {
    Ls.push("【胸腔科門診預診摘要】" + nowStr());
    const sex = ans.sex === "m" ? "男" : ans.sex === "f" ? "女" : "性別未填";
    Ls.push(`病人：${ans.age ? ans.age + " 歲" : "年齡未填"} ${sex}｜${dxList(qById("visit"), "zh")[0] || "就診類型未填"}${pl.id !== "zh" ? "｜填寫語言：" + pl.zhName : ""}`);
  }
  const fl = flagsFromOptions().filter(x => x.lv === "red");
  if (fl.length) Ls.push((en ? "⚠ RED FLAGS: " : "⚠ 紅旗：") + fl.map(x => en ? x.en : x.text).join(S));
  Ls.push((en ? "CC: " : "主訴 CC：") + (vals(qById("cc")) || (en ? "N/A" : "未填")));
  Ls.push(en ? "HPI:" : "現病史 HPI：");
  groupsInFlow().forEach(g => {
    const parts = flow().filter(q => q.grp === g && isAnswered(q)).map(q => `${lbl(q)} ${vals(q)}`);
    Ls.push(`  [${en ? GROUP_EN[g] : GROUPS[g].name}] ${parts.join(S) || (en ? "N/A" : "未填")}`);
  });
  const ins = insights();
  if (ins.length) Ls.push((en ? "Alerts: " : "臨床提醒：") + ins.map(x => en ? x.en : x.text).join(S));
  HX_IDS.forEach(id => {
    const q = qById(id);
    if (flow().includes(q)) Ls.push(`${lbl(q)}${C}${vals(q) || (en ? "N/A" : "未填")}`);
  });
  if (isAnswered(qById("note"))) Ls.push((en ? "Patient's note: " : "病人補充：") + ans.note.trim());
  Ls.push(en ? `(Self-reported by patient via tap-based intake; not verified by physician | Chest Intake ${APP.version})`
             : `（本摘要由病人自行點選產生，內容未經醫師確認｜胸訴 ${APP.version}）`);
  return Ls.join("\n");
}

function paintStepper(){
  const el = document.getElementById("stepper");
  if (screen !== "q" && screen !== "review"){ el.hidden = true; return; }
  el.hidden = false;
  const f = flow(), names = T("sec");
  const curSec = screen === "review" ? "review" : qById(curId).sec;
  const ci = SECTIONS.findIndex(s => s.id === curSec);
  el.innerHTML = SECTIONS.map((s, i) => {
    const cls = i < ci ? "done" : i === ci ? "now" : "";
    let p = "100%";
    if (i === ci && screen === "q"){
      const inSec = f.filter(q => q.sec === s.id);
      const k = inSec.findIndex(q => q.id === curId);
      p = Math.round(((k + 1) / inSec.length) * 100) + "%";
    }
    return `<div class="st ${cls}" style="--p:${p}"><i></i>${i+1} ${esc(names[i] || s.name)}</div>`;
  }).join("");
}

function toggle(q, v){
  let arr = valList(q).slice();
  const x = optOf(q, v), sv = String(v);
  if (arr.map(String).includes(sv)) arr = arr.filter(a => String(a) !== sv);
  else if (x && x.none) arr = [x.v];
  else { arr = arr.filter(a => !(optOf(q, a) || {}).none); arr.push(x.v); }
  ans[q.id] = arr;
  return arr.map(String).includes(sv);
}
function maybeAlert(q, x){
  if (!x || !x.alert || alerted.has(x.dx)) return false;
  alerted.add(x.dx);
  const tr = fmt(T("alertText"), to(q, x));
  document.getElementById("alertText").innerHTML = esc(tr) + (foreign() ? `<small class="zh" style="display:block;margin-top:10px;font-weight:500;font-size:15px">${esc(fmt(UI_ZH.alertText, x.label))}</small>` : "");
  document.getElementById("alert").hidden = false;
  say(UI_ZH.alertHead.replace("⚠ ","") + "。" + fmt(UI_ZH.alertText, x.label), T("alertHead").replace("⚠ ","") + ". " + tr, "alert");
  return true;
}
function bindQ(q){
  const sayPick = x => { flash(to(q, x)); if (!maybeAlert(q, x)) say(x.label, to(q, x), q.id + "__" + x.v); };
  if (q.type === "single" || q.type === "lvl"){
    view.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
      const x = optOf(q, b.dataset.v);
      ans[q.id] = x.v; save(); sayPick(x); renderQ();
    });
  } else if (q.type === "multi" || q.type === "body"){
    view.querySelectorAll("svg [data-v]").forEach(b => b.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); b.dispatchEvent(new MouseEvent("click", { bubbles:true })); }
    }));
    view.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
      const x = optOf(q, b.dataset.v);
      const on = toggle(q, x.v); save();
      if (on) sayPick(x); else say(UI_ZH.removed + "，" + x.label, T("removed") + ", " + to(q, x), null);
      renderQ();
    });
  } else if (q.type === "nrs"){
    view.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
      const n = b.dataset.v;
      ans[q.id] = Number(n); save(); flash(fmt(T("pts"), n)); say(n + " 分", fmt(T("pts"), n), null); renderQ();
    });
  } else if (q.type === "num"){
    view.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
      let s = String(ans[q.id] || "");
      const k = b.dataset.k;
      if (k === "c") s = ""; else if (k === "b") s = s.slice(0, -1);
      else if (s.length < 3 && !(s === "" && k === "0")) s += k;
      if (Number(s) > 120) s = s.slice(0, -1);
      ans[q.id] = s; save();
      document.getElementById("numShow").innerHTML = (s || "&nbsp;") + `<small>${esc(T("unit"))}</small>`;
      if (k !== "c" && k !== "b") say(k, k, null);
      document.getElementById("btnNext").textContent = s ? T("next") : T("skip");
    });
  } else if (q.type === "text"){
    const ta = document.getElementById("noteTa");
    ta.oninput = () => { ans[q.id] = ta.value; save(); };
    bindMic(ta, q);
  }
}

/* ---------- 語音輸入：辨識語言跟著目前語言（台語客語用華語辨識） ---------- */
let rec = null;
function bindMic(ta, q){
  const btn = document.getElementById("micBtn"); if (!btn) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const idle = () => `<b>🎤</b><span>${esc(T("micStart"))}</span>`;
  btn.onclick = () => {
    if (rec){ rec.stop(); return; }
    stopAll();
    rec = new SR(); rec.lang = foreign() ? L().code : "zh-TW"; rec.interimResults = true; rec.continuous = true;
    const base = ta.value ? ta.value.replace(/\s*$/, "") + (/[。，！？.!?]$/.test(ta.value.trim()) ? " " : (foreign() ? ". " : "。")) : "";
    let finals = "";
    rec.onresult = e => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++){
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finals += t; else interim += t;
      }
      ta.value = base + finals + interim; ans[q.id] = ta.value; save();
    };
    const stop = () => { rec = null; btn.classList.remove("rec"); btn.innerHTML = idle(); };
    rec.onend = stop;
    rec.onerror = ev => { stop(); if (ev.error === "not-allowed") alert(T("micDenied")); };
    try { rec.start(); btn.classList.add("rec"); btn.innerHTML = `<b>●</b><span>${esc(T("micRec"))}</span>`; }
    catch(e){ stop(); }
  };
}

/* ============================================================
   7.5 伺服器連線（院內平板：病人用序號送出，醫師用序號取回）
   ------------------------------------------------------------
   · 連線資訊存在這台裝置的設定裡，三欄都填才啟用。
   · 送出的是答案代碼與時間，不含姓名、病歷號。
   · 伺服器逾時自動刪除；醫師看完可按「刪除伺服器上的資料」。
   · 沒設定或連不上時，App 照常單機運作，不影響問診。
   ============================================================ */
const apiOn = () => !!(settings.api && settings.key && settings.clinic);
const apiBase = () => String(settings.api || "").replace(/\/+$/, "");
async function api(path, opt){
  const o = Object.assign({ headers:{} }, opt);
  o.headers = Object.assign({ "X-Clinic-Key":settings.key }, o.headers);
  if (o.body) o.headers["Content-Type"] = "application/json";
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const r = await fetch(apiBase() + path, Object.assign({ signal:ctrl.signal }, o));
    const txt = await r.text();
    let data; try { data = JSON.parse(txt); } catch(e){ data = { error:"bad_response" }; }
    if (!r.ok){ const e = new Error(data.error || r.status); e.status = r.status; e.data = data; throw e; }
    return data;
  } finally { clearTimeout(timer); }
}
const API_MSG = {
  bad_clinic_key:"診間金鑰不正確，請到設定確認。",
  not_found:"找不到這個序號的資料。請確認序號，或病人是否已送出。",
  server_not_configured:"伺服器尚未設定金鑰，請聯絡管理者。",
  too_many_requests:"操作太頻繁，請稍候再試。",
  bad_response:"伺服器回覆格式不正確。"
};
const apiMsg = e => API_MSG[e && (e.data && e.data.error || e.message)] ||
  (e && e.name === "AbortError" ? "連線逾時，請確認網路。" : "連線失敗，請確認網路與伺服器網址。");

/* 不記名統計：沒有序號、沒有自由輸入文字，年齡只送十歲一組 */
function statsPayload(seconds, completed){
  const f = flow();
  const red = flagsFromOptions().filter(x => x.lv === "red");
  const age = Number(ans.age);
  return {
    clinic:settings.clinic, lang:ans._lang || settings.lang,
    age_band: age ? (age >= 90 ? "90+" : (Math.floor(age / 10) * 10) + "-" + (Math.floor(age / 10) * 10 + 9)) : "",
    sex:ans.sex || "",
    cc: Array.isArray(ans.cc) ? ans.cc.slice() : [],
    red: red.length > 0, red_kinds: red.map(x => x.text),
    answered: f.filter(isAnswered).length, skipped: f.filter(q => !isAnswered(q)).length, total: f.length,
    seconds, completed, device: matchMedia("(pointer:coarse)").matches ? "touch" : "desktop", version:APP.version
  };
}
function sendStats(seconds, completed){
  if (!apiOn()) return;
  api("/api/stats", { method:"POST", body:JSON.stringify(statsPayload(seconds, completed)) }).catch(() => {});
}

  sel.innerHTML = `<option value="">請選擇診間…</option>` +
    list.map(c => `<option value="${esc(c)}"${c === settings.clinic ? " selected" : ""}>${esc(c)}</option>`).join("");
  document.getElementById("apiShow").textContent = settings.api || "（未設定）";
  document.getElementById("keyShow").textContent = maint ? (settings.key || "（未設定）") : maskKey(settings.key);
  lockBox.hidden = maint; cfg.api.hidden = !maint; cfg.key.hidden = !maint;
  lockBox.classList.toggle("open", maint);
  document.getElementById("apiNote").textContent = !settings.clinic
    ? "請先選擇這台平板所在的診間，才會啟用「送出給醫師」。"
    : apiOn() ? `已啟用：病人填完後可用看診號碼送出給醫師（${settings.clinic}）。資料只保留數小時，看診後可立即刪除。`
              : "伺服器尚未設定，資料只留在這台裝置。";
}
sel.addEventListener("change", () => {
  settings.clinic = sel.value; store.set("settings", settings); paintApi();
  if (screen !== "q") render();
});
["api","key"].forEach(k => cfg[k].addEventListener("change", () => {
  settings[k] = cfg[k].value.trim(); store.set("settings", settings); paintApi();
}));
/* 維護模式：連點五下標題 */
(() => {
  let n = 0, t = null;
  document.getElementById("apiTitle").addEventListener("click", () => {
    clearTimeout(t); t = setTimeout(() => { n = 0; }, 1500);
    if (++n < 5) return;
    n = 0; maint = true; paintApi();
    flash("維護模式：可修改伺服器網址與金鑰");
  });
})();
document.getElementById("btnPing").onclick = async () => {
  const note = document.getElementById("apiNote");
  Object.keys(cfg).forEach(k => { settings[k] = cfg[k].value.trim(); });
  store.set("settings", settings);
  if (!apiOn()){ note.textContent = "請先填好診間名稱、伺服器網址與診間金鑰。"; return; }
  note.textContent = "測試中…";
  try {
    const h = await api("/api/health");
    await api(`/api/visits?clinic=${encodeURIComponent(settings.clinic)}`);
    note.textContent = `連線成功。資料保留 ${h.retain_hours} 小時後自動刪除。`;
  } catch(e){ note.textContent = "連線失敗：" + apiMsg(e); }
};

document.getElementById("btnClose").onclick = () => { maint = false; dlg.close(); };

/* 語音選單：列出這台裝置上目前語言可用的語音，建議的排最前面 */
const vCode = () => (L().foreign ? L().code : "zh-TW");
function voiceLabel(v, i){
  const id = v.name + " " + (v.voiceURI || "");
  const tags = [];
  if (i === 0) tags.push("建議");
  if (/enhanced|premium|加強|高品質|natural|neural/i.test(id)) tags.push("高品質");
  if (NOVELTY.test(id)) tags.push("機械感");
  if (!v.localService) tags.push("需網路");
  return `${v.name}（${normLang(v)}）${tags.length ? "・" + tags.join("、") : ""}`;
}
function paintVoices(){
  const sel = document.getElementById("voiceSel"), tip = document.getElementById("voiceTip");
  const code = vCode(), list = voicesFor(code), want = settings.voices[code];
  if (!hasTTS || !list.length){
    sel.innerHTML = `<option>這台裝置沒有${code === "zh-TW" ? "中文" : L().zhName}語音</option>`; sel.disabled = true;
  } else {
    sel.disabled = false;
    sel.innerHTML = `<option value="">自動（${esc(list[0].name)}）</option>` +
      list.map((v, i) => `<option value="${esc(v.voiceURI)}"${v.voiceURI === want ? " selected" : ""}>${esc(voiceLabel(v, i))}</option>`).join("");
  }
  const hq = list.some(v => /enhanced|premium|加強|高品質|natural|neural/i.test(v.name + " " + (v.voiceURI || "")));
  tip.textContent = isIOS && code === "zh-TW" && !hq
    ? "這台 iPhone／iPad 沒有高品質中文語音。可到「設定 → 輔助使用 → 朗讀內容 → 聲音 → 中文（台灣）→ 美佳」下載加強版，下載後重新開啟本 App。"
    : "每台裝置可以各自選擇；選好後按「試聽」確認。";
}
document.getElementById("voiceSel").onchange = e => {
  const code = vCode();
  if (e.target.value) settings.voices[code] = e.target.value; else delete settings.voices[code];
  store.set("settings", settings);
};
document.getElementById("btnTry").onclick = () => {
  const code = vCode();
  const text = code === "zh-TW" ? "您好，請問今天哪裡不舒服？" : (tq(qById("cc")) || "Hello");
  unlock(); stopAll(); tts(text, code, false);
};
if (hasTTS && speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", () => { if (dlg.open) paintVoices(); });
document.getElementById("btnTest").onclick = () => say("您好，這是胸腔科問診的語音測試。", T("heroTitle").join(", "), "hero");
document.getElementById("btnWipe").onclick = () => { dlg.close(); wipe(); };
if (hasTTS && speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", () => { if (screen === "home") render(); });

applySettings();
if (L().audio) probeAudio(settings.lang);
render();

/* ============================================================
   9. PWA：QR Code、安裝、離線、版本更新
   ============================================================ */
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let deferredPrompt = null, swReg = null;

function paintShare(){
  document.getElementById("qrUrl").textContent = APP.url;
  const sh = document.getElementById("btnShare");
  sh.hidden = !navigator.share;
}
document.getElementById("btnCopy").onclick = async () => {
  try { await navigator.clipboard.writeText(APP.url); flash("已複製網址"); }
  catch(e){ prompt("請複製這個網址", APP.url); }
};
document.getElementById("btnShare").onclick = () => {
  navigator.share({ title:"胸訴 — 胸腔科門診問診", text:"用點的，告訴醫生您哪裡不舒服", url:APP.url }).catch(() => {});
};

function paintInstall(){
  const box = document.getElementById("installBox");
  const offline = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
  const status = `<div class="status">
    <span class="${isStandalone() ? "y" : ""}">${isStandalone() ? "✓ App 模式" : "瀏覽器模式"}</span>
    <span class="${offline ? "y" : ""}">${offline ? "✓ 可離線使用" : "離線功能尚未就緒"}</span>
    <span>${APP.version}</span></div>`;
  if (isStandalone()){
    box.innerHTML = `<p class="ok">已安裝，正在以 App 模式執行。</p>${status}`;
  } else if (deferredPrompt){
    box.innerHTML = `<p>安裝後會出現在主畫面，開啟時沒有網址列，沒有網路也能使用。</p>
      <button class="bigbtn ok block" id="btnInstall">安裝到這台裝置</button>${status}`;
    document.getElementById("btnInstall").onclick = async () => {
      deferredPrompt.prompt();
      const r = await deferredPrompt.userChoice.catch(() => null);
      deferredPrompt = null;
      if (r && r.outcome === "accepted") flash("已安裝");
      paintInstall();
    };
  } else if (isIOS){
    box.innerHTML = `<p>iPhone／iPad 請用 <b>Safari</b> 開啟本網址，然後：</p>
      <ol><li>按下方的「分享」按鈕 <b>⬆︎</b></li><li>往下滑，選「加入主畫面」</li><li>按右上角「新增」</li></ol>${status}`;
  } else {
    box.innerHTML = `<p>Android 請用 <b>Chrome</b> 開啟本網址，然後：</p>
      <ol><li>按右上角選單 <b>⋮</b></li><li>選「安裝應用程式」或「加到主畫面」</li></ol>${status}`;
  }
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; if (dlg.open) paintInstall(); });
window.addEventListener("appinstalled", () => { deferredPrompt = null; flash("已安裝到主畫面"); if (dlg.open) paintInstall(); });

/* 新版本：不自動重新整理（避免病人填到一半畫面跳掉），改成顯示更新按鈕；
   填答存在本機，更新後不會遺失。 */
function showUpdate(worker){
  const bar = document.getElementById("updBar");
  bar.hidden = false;
  bar.onclick = () => { bar.hidden = true; worker.postMessage("SKIP_WAITING"); };
}
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  let reloading = false;
  /* 第一次註冊時 controller 由無變有，這不是換版本，不該重新整理（會打斷填答） */
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloading) return; reloading = true; location.reload();
  });
  navigator.serviceWorker.register("sw.js").then(reg => {
    swReg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) showUpdate(w); });
    });
  }).catch(() => {});
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && swReg) swReg.update().catch(() => {}); });
}

/* 捷徑：?mode=doc 直接開醫師摘要（安裝後長按圖示可選） */
if (new URLSearchParams(location.search).get("mode") === "doc"){ screen = "doc"; render(); }
</script>
